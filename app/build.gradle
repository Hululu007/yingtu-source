apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.yingtu.plus'
    // 分叉 media3 AAR 的 minCompileSdk=36，34 编不过，故升到 36。
    // targetSdk 保持 34 不动；AGP 同步升到 8.10.1（见根 build.gradle），Gradle 升到 8.13。
    compileSdk 36

    // 上游代码在用 BuildConfig.* 与 databinding（上游 build.gradle 从没声明过，编不过），
    // AGP 8.x 下 buildConfig 与 viewBinding 默认关闭，须显式打开。
    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    defaultConfig {
        applicationId "com.yingtu.plus"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0.0"
        // BuildConfig 自定义字段：代码在用这 4 个字段，但上游 build.gradle 从没声明过；
        // APPLICATION_ID / DEBUG / VERSION_CODE / VERSION_NAME 是 buildConfig=true 后自动生成的标准字段，不用声明。
        // FLAVOR_mode：Util.isLeanback()/isMobile() 判 "leanback"/"mobile"，本包是手机版故填 mobile。
        buildConfigField "String", "FLAVOR_mode", "\"mobile\""
        buildConfigField "String", "BUILD_TAG", "\"2.0.0\""
        buildConfigField "String", "BUILD_TIME", "\"2026-11-11\""
        buildConfigField "String", "MEDIA3_VERSION", "\"1.11.0-alpha01-fongmi\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // 只出 arm64-v8a 单架构（用户长期令）
        ndk {
            abiFilters 'arm64-v8a'
        }
        python {
            version = "3.10"
        }
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // bcprov-jdk18on 与 jspecify 都带 META-INF/versions/9/OSGI-INF/MANIFEST.MF，
    // mergeDebugJavaResource 报重复文件，排除之。
    packaging {
        resources {
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}

// 禁用 AAR 元数据检查（nextlib AAR 的 minCompileSdk=37，CI 的 SDK 仓库无 android-37 包）
tasks.matching { it.name == 'checkDebugAarMetadata' || it.name == 'checkReleaseAarMetadata' }.configureEach {
    enabled = false
    onlyIf { false }
}

// 全部 androidx.media3 依赖强制解析到 FongMi 分叉版：
// nextlib-media3ext AAR 是 1.10.0-0.12.1-fongmi-softload-av3a-avs3-ffmpeg901-r5 版（FFmpeg 9.0.1，带 AVS3 解码），传递依赖会把 media3 拉回 1.10.0，不强制就混版。
configurations.all {
    // 某传递依赖带了 com.android.support:support-compat:24.2.1，
    // 它与 androidx.core:1.18.0 都含有 android.support.v4.app.INotificationSideChannel 等
    // AIDL 类，checkDebugDuplicateClasses 报重复类。
    // 全树 Java 代码零 android.support 引用（已 grep 核实），整个 com.android.support 组都可排除。
    exclude group: 'com.android.support'
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.media3') {
            details.useVersion '1.11.0-alpha01-fongmi'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation files('libs/nextlib-media3ext-ffmpeg901-r5.aar')
    implementation files('libs/forcetech-release.aar')
    implementation files('libs/hook-release.aar')
    implementation files('libs/jianpian-release.aar')
    implementation files('libs/thunder-release.aar')
    implementation files('libs/tvbus-release.aar')
    // Media3 用 FongMi 分叉 1.11.0-alpha01-fongmi：
    // 官方 1.10.0 没有分叉专属 API（MediaEdition、TextRenderer.Observer、弹幕、PlaybackDiagnostics）。
    // 产物无公开远程仓库，走 settings.gradle 里 third_party/maven 本地仓；nextlib 那个 AAR 是按 1.10.0
    // 编的，它的传递依赖也强制拉到分叉版（上面 configurations.all），与 dm17 同款组合。
    implementation 'androidx.media3:media3-common:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-exoplayer:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-exoplayer-dash:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-ui:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-ui-danmaku:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-extractor:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-datasource:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-datasource-okhttp:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-decoder:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-database:1.11.0-alpha01-fongmi'
    implementation 'androidx.media3:media3-effect:1.11.0-alpha01-fongmi'
    // DKPlayer 打包的 ijk 内核 + Findroid 预编译 libmpv
    implementation 'xyz.doikki.android.dkplayer:player-ijk:3.3.7'
    implementation 'dev.jdtech.mpv:libmpv:0.3.1'
    // MpvHlsProxy 用 NanoHTTPD 起本地 HLS 代理
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    // OkGlideModule 用 com.bumptech.glide.integration.okhttp3.OkHttpUrlLoader
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.simpleframework:simple-xml:2.7.1'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'com.google.guava:guava:33.3.1-android'
    // jupnp 三件套：2.6.1 的 core 包里没有 org.jupnp.android 与 org.jupnp.support，
    // android 构件从 3.0.0 才有，support 须单独声明；三件统一升到 3.0.3
    implementation 'org.jupnp:org.jupnp:3.0.3'
    implementation 'org.jupnp:org.jupnp.support:3.0.3'
    implementation 'org.jupnp:org.jupnp.android:3.0.3'
    // 以下为全树清点出的其他缺失依赖（代码在用，原 build.gradle 未声明）：
    // swiperefreshlayout 与 juniversalchardet 没接——树里 0 处引用，用不上。
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.3'
    implementation 'com.guolindev.permissionx:permissionx:1.8.1'
    implementation 'com.suyashbelekar:exoplayerhdrutils:0.4.0'
    implementation 'com.github.bassaer:materialdesigncolors:1.0.0'
    // 注入的 document-start 要它才真生效（DocumentStartScripts 是反射版，包不存在时返回 null）
    implementation 'androidx.webkit:webkit:1.16.0'
    implementation project(':catvod')
    implementation project(':quickjs')
}
