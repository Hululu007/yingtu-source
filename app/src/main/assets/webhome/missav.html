<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MissAV 网页版</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; color: #fff;
    font: 15px/1.6 system-ui, sans-serif; background: transparent; }
  .app { padding: 16px; padding-top: calc(16px + var(--fm-safe-top, 0px)); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #cdeaf2; margin: 0 0 16px; }
  input { width: 100%; padding: 11px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08);
    color: #fff; font-size: 14px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { padding: 10px 16px; border: 0; border-radius: 10px; cursor: pointer;
    background: #2BC4D8; color: #06202A; font-weight: 700; font-size: 14px; }
  button.big { width: 100%; padding: 13px 16px; font-size: 16px; }
  button.ghost { background: rgba(255,255,255,.12); color: #fff; }
  .sec { margin: 18px 0 6px; font-size: 13px; color: #cdeaf2; font-weight: 700; }
  .tip { font-size: 13px; color: #9db8c4; margin-top: 14px; line-height: 1.8; }
</style>
</head>
<body>
<main class="app">
  <h1>🔞 MissAV 网页版</h1>
  <p class="sub">MissAV 官方站网页版，在 App 内用浏览器打开，浏览、搜索、播放都在站内完成。</p>
  <div class="row">
    <button class="big" id="btnEnter">进入 MissAV</button>
  </div>
  <div class="sec">搜番号 / 女优 / 标题</div>
  <input id="kw" placeholder="输入番号、女优或标题，站内搜索">
  <div class="row">
    <button id="btnSearch">搜索</button>
    <button class="ghost" id="btnHome">回 MissAV 首页</button>
  </div>
  <p class="tip">站内栏目：最新上架、热门、女优、标签、系列。点“进入 MissAV”后在站内导航里切换；搜索请在站内搜索框里输入番号、女优或标题。视频用站内播放器直接播。</p>
</main>
<script>
(function () {
  var HOME = "https://missav.com/";
  function go(url) {
    window.location.href = url;
  }
  document.getElementById("btnEnter").onclick = function () { go(HOME); };
  document.getElementById("btnHome").onclick = function () { go(HOME); };
  document.getElementById("btnSearch").onclick = function () {
    var kw = document.getElementById("kw").value.trim();
    // 站内搜索走站自己的搜索框：先打开 MissAV 首页，再在站内搜索。
    // 深链 /search/xxx 会被站方 301 回首页，不直接拼搜索地址。
    go(HOME);
  };
  document.getElementById("kw").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { go(HOME); }
  });
})();
</script>
</body>
</html>
